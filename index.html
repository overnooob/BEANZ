<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEANZ</title>
<style>
:root{--y:#FFD60A;--y2:#E6B800;--k:#000;--k1:#0b0b0b;--k2:#161616;--k3:#242424;--k4:#333;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--k1);color:var(--y);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{height:64px;flex:none;background:var(--k);border-bottom:2px solid var(--k3);display:flex;align-items:center;gap:14px;padding:0 16px}
.logo{font-weight:900;font-size:34px;line-height:1.1;letter-spacing:2px;background:var(--y);color:var(--k);padding:2px 14px;border-radius:10px;transform:skew(-6deg)}
.sp{flex:1}
.bux{background:var(--k3);color:var(--y);font-weight:900;font-size:24px;padding:7px 18px 7px 8px;border-radius:30px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.bux i{width:32px;height:32px;border-radius:50%;background:var(--y);color:var(--k);font-style:normal;font-size:17px;display:grid;place-items:center}
.wrap{flex:1;display:flex;min-height:0}
aside{width:230px;flex:none;background:var(--k);border-right:2px solid var(--k3);padding:12px 10px;display:flex;flex-direction:column;gap:6px}
aside button{display:flex;align-items:center;gap:14px;background:transparent;border:0;color:var(--y);font:inherit;font-weight:700;font-size:19px;padding:14px 16px;border-radius:12px;cursor:pointer;text-align:left}
aside button svg{width:28px;height:28px;fill:currentColor;flex:none}
aside button:hover{background:var(--k3)}
aside button.on{background:var(--y);color:var(--k)}
main{flex:1;overflow:auto;padding:24px}
.page{display:none}.page.on{display:block}
h2{margin:0 0 18px;font-size:24px}
.av{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:22px;max-width:1000px}
@media(max-width:800px){.av{grid-template-columns:1fr}}
.stage{background:radial-gradient(circle at 50% 35%,var(--k3),var(--k2) 70%);border:2px solid var(--k3);border-radius:18px;display:grid;place-items:center;padding:24px;min-height:400px;cursor:pointer}
.stage svg{width:100%;max-width:260px;height:auto}
.panel{background:var(--k2);border:2px solid var(--k3);border-radius:18px;padding:16px;min-height:400px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--k3);color:var(--y);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.tabs button:hover{background:var(--k4)}
.tabs button.on{background:var(--y);color:var(--k)}
.tabs.sub{border-bottom:2px solid var(--k3);padding-bottom:12px;margin-bottom:16px}
.tabs.sub button{background:transparent;padding:6px 12px}
.tabs.sub button.on{background:var(--k4);color:var(--y);box-shadow:inset 0 -3px 0 var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.item{background:var(--k3);border:2px solid transparent;border-radius:12px;padding:8px;cursor:pointer;color:var(--y);font:inherit;font-size:13px;font-weight:700;text-align:center}
.item:hover{background:var(--k4)}
.item.on{border-color:var(--y)}
.item svg{width:64px;height:64px;display:block;margin:0 auto 4px}
.sw2{aspect-ratio:1;border-radius:12px;border:3px solid transparent;cursor:pointer;padding:0}
.sw2.on{border-color:#fff;box-shadow:0 0 0 2px var(--k)}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--k2);border:2px solid var(--k3);border-radius:12px;padding:14px 16px;margin-bottom:10px;max-width:560px}
.sw{position:relative;width:48px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--k4);border-radius:20px;transition:.15s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--y);transition:.15s}
.sw input:checked+span{background:var(--y)}
.sw input:checked+span:after{left:25px;background:var(--k)}
input[type=range]{accent-color:var(--y);width:160px}
select{background:var(--k);color:var(--y);border:2px solid var(--y);border-radius:8px;padding:6px 10px;font:inherit}
#fps{position:fixed;right:10px;bottom:10px;background:var(--k);color:var(--y);border:2px solid var(--y);border-radius:8px;padding:3px 8px;font-weight:700;display:none;z-index:9}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(max-width:700px){
 .top{height:52px;padding:0 12px}
 .logo{font-size:24px;padding:2px 10px;border-radius:8px}
 .bux{font-size:18px;padding:5px 14px 5px 6px;gap:8px}
 .bux i{width:26px;height:26px;font-size:14px}
 .wrap{flex-direction:column-reverse}
 aside{width:100%;flex-direction:row;border-right:0;border-top:2px solid var(--k3);padding:6px 4px;gap:2px;justify-content:space-around}
 aside button{flex:1;flex-direction:column;justify-content:center;gap:3px;font-size:12px;padding:8px 2px;min-height:54px;text-align:center;border-radius:10px}
 aside button svg{width:24px;height:24px}
 main{padding:14px}
 h2{font-size:22px;margin-bottom:12px}
 .stage{min-height:300px;padding:16px}
 .stage svg{max-width:210px}
 .panel{min-height:0;padding:12px}
 .tabs button{padding:9px 12px;font-size:14px}
 .tabs.sub button{padding:7px 10px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
 .row{padding:12px 14px;font-size:15px}
 input[type=range]{width:120px}
 #fps{bottom:70px}
}
.auth{position:fixed;inset:0;z-index:100;background:var(--k1);display:grid;place-items:center;padding:20px;overflow:auto}
.auth.hide{display:none}
.auth.load .card{visibility:hidden}
.auth .card{width:100%;max-width:380px;background:var(--k2);border:2px solid var(--k3);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px}
.auth .logo{align-self:center;font-size:44px;margin-bottom:8px}
.auth .tabs{margin:0}
.auth .tabs button{flex:1}
.auth input{height:50px;background:var(--k3);border:2px solid transparent;border-radius:10px;color:var(--y);padding:0 14px;font:inherit;font-size:16px;width:100%}
.auth input:focus{border-color:var(--y);outline:0}
.auth input::placeholder{color:#8a7a2a}
.go{height:52px;background:var(--y);color:var(--k);border:0;border-radius:10px;font:inherit;font-weight:900;font-size:18px;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.err{color:#ff6b5e;font-size:14px;font-weight:700;text-align:center}
.err:empty{display:none}
.out{background:var(--k3);color:var(--y);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.sec{font-size:19px;margin:28px 0 10px;max-width:560px;padding-bottom:6px;border-bottom:2px solid var(--k3)}
#settings h2+.sec{margin-top:4px}
.box{background:var(--k2);border:2px solid var(--k3);border-radius:12px;padding:14px 16px;margin-bottom:10px;max-width:560px;display:flex;flex-direction:column;gap:10px}
.inp{height:46px;background:var(--k3);border:2px solid transparent;border-radius:10px;color:var(--y);padding:0 14px;font:inherit;font-size:16px;width:100%}
.inp:focus{border-color:var(--y);outline:0}
.inp:disabled{opacity:.5}
.inp::placeholder{color:#8a7a2a}
.box .go{height:46px;font-size:16px}
.go.alt{background:var(--k3);color:var(--y)}
.note{font-size:14px;font-weight:700}
.note:empty{display:none}
.note.bad{color:#ff6b5e}
.pname{font-size:22px;font-weight:900;word-break:break-all}
.puser{font-size:14px;opacity:.7;word-break:break-all}
.fq{max-width:560px;margin-bottom:12px}
#friends .sec{margin-top:18px}
.pc{display:flex;align-items:center;gap:12px;background:var(--k2);border:2px solid var(--k3);border-radius:12px;padding:10px 12px;margin-bottom:8px;max-width:560px}
.pav{width:52px;height:56px;flex:none;background:var(--k3);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.pav svg{width:44px;height:48px}
.pn{flex:1;min-width:0;display:flex;flex-direction:column}
.pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa{display:flex;gap:6px;flex:none}
.fb{background:var(--y);color:var(--k);border:0;border-radius:8px;padding:9px 12px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.fb.alt{background:var(--k3);color:var(--y)}
#rcount:not(:empty){background:#ff453a;color:#fff;border-radius:10px;padding:0 7px;margin-left:6px;font-size:12px}
.empty{opacity:.7;padding:8px 2px}
#fnote{margin-bottom:8px}
.pstats{display:flex;gap:18px;font-size:14px;font-weight:700;flex-wrap:wrap}
.pn .pstats{gap:12px;font-size:12px;font-weight:700;opacity:.7}
.pa{flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.pc{flex-wrap:wrap}.pa{width:100%}}
</style>
</head>
<body>
<div class="auth load" id="auth">
  <div class="card">
    <div class="logo">BEANZ</div>
    <div class="tabs" id="atabs"><button class="on" data-m="login">Login</button><button data-m="register">Register</button></div>
    <input id="u" type="text" placeholder="Username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input id="p" type="password" placeholder="Password" maxlength="30" autocomplete="current-password">
    <button class="go" id="go">Login</button>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>
<div class="top">
  <div class="logo">BEANZ</div>
  <div class="sp"></div>
  <div class="bux"><i>B</i><span id="bux">0</span></div>
</div>
<div class="wrap">
  <aside id="nav">
    <button data-p="games" class="on"><svg viewBox="0 0 24 24"><path d="M6 8h12a4 4 0 0 1 3.9 4.9l-.8 3.6A2.5 2.5 0 0 1 16.4 17l-1-1.5h-6.8l-1 1.5a2.5 2.5 0 0 1-4.7-.5l-.8-3.6A4 4 0 0 1 6 8Zm1 2v1.5H5.5v1.8H7v1.5h1.8v-1.5h1.5v-1.8H8.800V10H7Zm9 1.2a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.200Zm2.500 1.800a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.200Z"/></svg>Games</button>
    <button data-p="avatar"><svg viewBox="0 0 24 24"><path d="M12 12a4.500 4.500 0 1 0 0-9 4.500 4.500 0 0 0 0 9Zm0 2c-4.400 0-8 2.200-8 5v2h16v-2c0-2.800-3.600-5-8-5Z"/></svg>Avatar</button>
    <button data-p="friends"><svg viewBox="0 0 24 24"><path d="M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 .5a3.200 3.200 0 1 0 0-6.400 3.200 3.200 0 0 0 0 6.400ZM9 14c-3.500 0-7 1.700-7 4v2h14v-2c0-2.300-3.500-4-7-4Zm7.500.2c2.900.2 5.500 1.600 5.500 3.800v2h-4v-2c0-1.400-.6-2.700-1.500-3.800Z"/></svg>Friends</button>
    <button data-p="settings"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M9.74 4.12 L10.34 1.53 L13.66 1.53 L14.26 4.12 A8.20 8.20 0 0 1 15.98 4.83 L18.23 3.42 L20.58 5.77 L19.17 8.02 A8.20 8.20 0 0 1 19.88 9.74 L22.47 10.34 L22.47 13.66 L19.88 14.26 A8.20 8.20 0 0 1 19.17 15.98 L20.58 18.23 L18.23 20.58 L15.98 19.17 A8.20 8.20 0 0 1 14.26 19.88 L13.66 22.47 L10.34 22.47 L9.74 19.88 A8.20 8.20 0 0 1 8.02 19.17 L5.77 20.58 L3.42 18.23 L4.83 15.98 A8.20 8.20 0 0 1 4.12 14.26 L1.53 13.66 L1.53 10.34 L4.12 9.74 A8.20 8.20 0 0 1 4.83 8.02 L3.42 5.77 L5.77 3.42 L8.02 4.83 A8.20 8.20 0 0 1 9.74 4.12 Z M8.20 12.00 a3.80 3.80 0 1 0 7.60 0 a3.80 3.80 0 1 0 -7.60 0Z"/></svg>Settings</button>
    <button data-p="create"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>Create</button>
  </aside>
  <main>
    <section class="page on" id="games"></section>
    <section class="page" id="avatar">
      <h2>Avatar</h2>
      <div class="av">
        <div class="stage"><svg id="preview" viewBox="0 0 260 280" aria-label="Bean"></svg></div>
        <div class="panel">
          <div class="tabs" id="tabs"></div>
          <div class="tabs sub" id="subs"></div>
          <div class="grid" id="items"></div>
        </div>
      </div>
    </section>
    <section class="page" id="friends">
      <h2>Friends</h2>
      <input class="inp fq" id="fq" type="text" placeholder="Search username" maxlength="20" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div class="tabs" id="ftabs"><button class="on" data-t="friends">Friends</button><button data-t="requests">Requests<span id="rcount"></span></button><button data-t="recommended">Recommended</button></div>
      <div class="note bad" id="fnote"></div>
      <div id="flist"></div>
    </section>
    <section class="page" id="settings">
      <h2>Settings</h2>
      <h3 class="sec">Audio</h3>
      <div class="row"><span>Music</span><label class="sw"><input type="checkbox" data-k="music" checked><span></span></label></div>
      <div class="row"><span>Music volume</span><input type="range" min="0" max="100" value="50" data-k="musicVol"></div>
      <div class="row"><span>Sound effects</span><label class="sw"><input type="checkbox" data-k="sfx" checked><span></span></label></div>
      <div class="row"><span>Effects volume</span><input type="range" min="0" max="100" value="70" data-k="sfxVol"></div>
      <h3 class="sec">Graphics</h3>
      <div class="row"><span>Graphics quality</span><select data-k="quality"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
      <div class="row"><span>Show FPS</span><label class="sw"><input type="checkbox" data-k="fps"><span></span></label></div>
      <h3 class="sec">Privacy</h3>
      <div class="row"><span>Friend requests</span><label class="sw"><input type="checkbox" data-k="req" checked><span></span></label></div>
      <h3 class="sec">Account</h3>
      <div class="box"><div class="pname" id="who"></div><div class="puser" id="whoUser"></div><div class="pstats"><span id="stF">Friends: 0</span><span id="stW">Followers: 0</span><span id="stFo">Following: 0</span></div></div>
      <div class="box">
        <span>Display name</span>
        <input class="inp" id="dn" type="text" maxlength="20" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button class="go" id="dnSave">Save</button>
        <div class="note" id="dnNote"></div>
      </div>
      <h3 class="sec">Password</h3>
      <div class="box">
        <input class="inp" id="pwOld" type="password" placeholder="Current password" maxlength="30" autocomplete="current-password">
        <input class="inp" id="pwNew" type="password" placeholder="New password (5-30 characters)" maxlength="30" autocomplete="new-password">
        <input class="inp" id="pwNew2" type="password" placeholder="Repeat new password" maxlength="30" autocomplete="new-password">
        <button class="go" id="pwBtn">Change password</button>
        <div class="note" id="pwNote"></div>
      </div>
      <h3 class="sec">Sessions</h3>
      <div class="box">
        <button class="go" id="logoutAll">Log out all other devices</button>
        <div class="note" id="loNote"></div>
      </div>
      <div class="box"><button class="go alt" id="logout">Log out</button></div>
    </section>
    <section class="page" id="create"></section>
  </main>
</div>
<div id="fps">0 FPS</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
$('#bux').textContent=store.get('bux',0);

/* Settings state */
const DEF={music:true,musicVol:50,sfx:true,sfxVol:70,quality:'Medium',fps:false,req:true};
const st=Object.assign({},DEF,store.get('settings',{}));
$$('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  el.type==='checkbox'?el.checked=st[k]:el.value=st[k];
  el.addEventListener('input',()=>{
    st[k]=el.type==='checkbox'?el.checked:(el.type==='range'?+el.value:el.value);
    store.set('settings',st);apply(k);if(window.BEANZ&&BEANZ.save)BEANZ.save();
    if(el.type==='checkbox')sfx(el.checked?'on':'off');
  });
});

/* Audio */
let ac,master,musicGain,sfxGain,timer,step=0,nextT=0;
function init(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  ac=new A();
  musicGain=ac.createGain();sfxGain=ac.createGain();
  musicGain.connect(ac.destination);sfxGain.connect(ac.destination);
  apply('musicVol');apply('sfxVol');
  nextT=ac.currentTime+.1;
  timer=setInterval(sched,100);
}
function apply(k){
  if(k==='fps'){$('#fps').style.display=st.fps?'block':'none'}
  if(!ac)return;
  if(k==='musicVol'||k==='music')musicGain.gain.value=st.music?st.musicVol/100*.22:0;
  if(k==='sfxVol'||k==='sfx')sfxGain.gain.value=st.sfx?st.sfxVol/100*.5:0;
}
const mel=[0,4,7,12,9,7,4,7, 2,5,9,14,12,9,5,9, 4,7,11,16,14,11,7,11, 5,9,12,17,16,12,9,7];
const bass=[0,0,0,0,0,0,0,0, -3,-3,-3,-3,-3,-3,-3,-3, -5,-5,-5,-5,-5,-5,-5,-5, -7,-7,-7,-7,-7,-7,-7,-7];
const f=n=>261.63*Math.pow(2,n/12);
function tone(freq,t,d,type,vol,dest){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02);
}
function sched(){
  while(nextT<ac.currentTime+.4){
    const i=step%32,spb=.21;
    tone(f(mel[i]),nextT,spb*1.6,'triangle',.9,musicGain);
    if(i%2===0)tone(f(bass[i]-12),nextT,spb*1.8,'square',.35,musicGain);
    if(i%4===2)tone(f(mel[i]+12),nextT,.06,'sine',.25,musicGain);
    nextT+=spb;step++;
  }
}
function sfx(type){
  if(!ac||!st.sfx)return;
  const t=ac.currentTime;
  if(type==='click'){tone(660,t,.08,'square',.5,sfxGain);tone(990,t+.04,.08,'square',.35,sfxGain)}
  if(type==='nav'){tone(520,t,.07,'triangle',.7,sfxGain);tone(780,t+.05,.12,'triangle',.7,sfxGain)}
  if(type==='on'){tone(600,t,.07,'square',.4,sfxGain);tone(900,t+.06,.1,'square',.4,sfxGain)}
  if(type==='off'){tone(700,t,.07,'square',.4,sfxGain);tone(450,t+.06,.1,'square',.4,sfxGain)}
  if(type==='boing'){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(700,t+.15);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.3)}
}
addEventListener('pointerdown',init);
addEventListener('keydown',init);
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});

/* Navigation */
$('#nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  $$('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.page').forEach(s=>s.classList.toggle('on',s.id===b.dataset.p));
  init();sfx('nav');
});
$('.stage').addEventListener('click',()=>{init();sfx('boing')});
$$('select,input[type=range]').forEach(el=>el.addEventListener('change',()=>sfx('click')));

/* Avatar */
const BEAN='M135 18C195 18 232 70 232 135C232 205 195 252 135 252C82 252 52 220 56 170C58 148 74 138 74 118C74 98 52 88 56 62C62 32 98 18 135 18Z';
const EYES='<ellipse cx="130" cy="108" rx="8" ry="13" fill="#000"/><ellipse cx="178" cy="108" rx="8" ry="13" fill="#000"/>';
const FACES={
 smile:'<path d="M134 144Q155 166 176 144" stroke="#000" stroke-width="7" fill="none" stroke-linecap="round"/>'
};
const COLORS=['#FFD60A','#FF9F0A','#FF453A','#FF6FB5','#BF5AF2','#5E5CE6','#0A84FF','#32D2F0','#30D158','#A2845E','#FFFFFF','#8E8E93'];
const tree={
 Body:{Color:COLORS,Faces:Object.keys(FACES)},
 Clothing:{Shirts:[],Pants:[],Jackets:[],Shoes:[]},
 Accessories:{Hats:[],Back:[],Front:[],Neck:[],Waist:[]}
};
const av=Object.assign({color:'#FFD60A',face:'smile'},store.get('avatar',{}));
if(!FACES[av.face])av.face='smile';
let cat='Body',sub='Color';
function beanSVG(face,color,small){
  const id='c'+Math.random().toString(36).slice(2,7);

    <g clip-path="url(#${id})"><ellipse cx="200" cy="275" rx="130" ry="95" fill="#000" opacity=".14"/><ellipse cx="100" cy="62" rx="14" ry="30" fill="#fff" opacity=".4" transform="rotate(25 100 62)"/></g>
    ${EYES}
    ${FACES[face]}
  </g>`;
}
function draw(){$('#preview').innerHTML=beanSVG(av.face,av.color)}
function render(){
  $('#tabs').innerHTML=Object.keys(tree).map(t=>`<button class="${t===cat?'on':''}" data-t="${t}">${t}</button>`).join('');
  $('#subs').innerHTML=Object.keys(tree[cat]).map(t=>`<button class="${t===sub?'on':''}" data-s="${t}">${t}</button>`).join('');
  const list=tree[cat][sub];
  if(sub==='Color')$('#items').innerHTML=list.map(c=>`<button class="sw2 ${av.color===c?'on':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
  else if(sub==='Faces')$('#items').innerHTML=list.map(f=>`<button class="item ${av.face===f?'on':''}" data-f="${f}"><svg viewBox="105 80 100 100">${(EYES+FACES[f]).split('#000').join('#FFD60A')}</svg>${f[0].toUpperCase()+f.slice(1)}</button>`).join('');
  else $('#items').innerHTML='';
}
$('#tabs').addEventListener('click',e=>{const t=e.target.dataset.t;if(!t)return;cat=t;sub=Object.keys(tree[t])[0];render();sfx('click')});
$('#subs').addEventListener('click',e=>{const t=e.target.dataset.s;if(!t)return;sub=t;render();sfx('click')});
$('#items').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c)av.color=b.dataset.c;
  if(b.dataset.f)av.face=b.dataset.f;
  store.set('avatar',av);render();draw();sfx('click');if(window.BEANZ&&BEANZ.save)BEANZ.save();
});
render();draw();
window.BEANZ={
  get(){return{bux:store.get('bux',0),avatar:{color:av.color,face:av.face},settings:Object.assign({},st)}},
  set(d){
    const b=Number.isInteger(d.bux)&&d.bux>=0?d.bux:0;
    store.set('bux',b);$('#bux').textContent=b;
    Object.assign(av,{color:'#FFD60A',face:'smile'},d.avatar||{});
    if(!FACES[av.face])av.face='smile';
    store.set('avatar',av);render();draw();
    const ns=Object.assign({},DEF);
    for(const k in DEF){if(d.settings&&typeof d.settings[k]===typeof DEF[k])ns[k]=d.settings[k]}
    Object.assign(st,ns);store.set('settings',st);
    $$('[data-k]').forEach(el=>{const k=el.dataset.k;el.type==='checkbox'?el.checked=st[k]:el.value=st[k]});
    ['music','musicVol','sfx','sfxVol','fps'].forEach(apply);
  },
  save:null
};

/* FPS */
let fr=0,lt=performance.now();
(function loop(now){fr++;if(now-lt>=1000){$('#fps').textContent=Math.round(fr*1000/(now-lt))+' FPS';fr=0;lt=now}requestAnimationFrame(loop)})(lt);
apply('fps');
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, collection, query, where, orderBy, limit, getDocs, writeBatch, getCountFromServer } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const app=initializeApp({
  apiKey:"AIzaSyDU9wR0CxRuw5QynQFjTAF1kRHTg0sbsnI",
  authDomain:"beanz-e1544.firebaseapp.com",
  projectId:"beanz-e1544",
  storageBucket:"beanz-e1544.firebasestorage.app",
  messagingSenderId:"946435868189",
  appId:"1:946435868189:web:4fe9a6d54bfec5bf96a8f4"
});
const auth=getAuth(app);
const db=getFirestore(app);
const $=s=>document.querySelector(s);
const click=()=>{try{window.sfx&&window.sfx('click')}catch(e){}};
const toEmail=n=>n.toLowerCase()+"@beanz.game";
const toPass=p=>p+"#beanz";
const DAY=864e5;
const NAME=/^[A-Za-z0-9_]{3,20}$/;
let mode="login",pending=false,fresh=false,unsub=null,userRef=null,saveTimer;

const mainName=u=>u.displayName||(u.email||"").split("@")[0];
const epKey=()=>"beanzEpoch_"+auth.currentUser.uid;
const getEp=()=>{try{return localStorage.getItem(epKey())}catch(e){return null}};
const setEp=v=>{try{localStorage.setItem(epKey(),String(v))}catch(e){}};
function say(el,t,bad){el.textContent=t||"";el.classList.toggle("bad",!!bad)}

/* Login / Register */
function setMode(m){
  mode=m;
  document.querySelectorAll("#atabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("#go").textContent=m==="login"?"Login":"Register";
  $("#u").placeholder=m==="login"?"Username":"Username (3-20 characters)";
  $("#p").placeholder=m==="login"?"Password":"Password (5-30 characters)";
  $("#p").autocomplete=m==="login"?"current-password":"new-password";
  $("#err").textContent="";
}
$("#atabs").addEventListener("click",e=>{const m=e.target.dataset.m;if(m){setMode(m);click()}});

function msg(e){
  switch(e.code){
    case "auth/email-already-in-use":return "This username is taken";
    case "auth/invalid-credential":
    case "auth/user-not-found":
    case "auth/wrong-password":
    case "auth/invalid-email":return "Wrong username or password";
    case "auth/network-request-failed":return "No connection";
    case "auth/too-many-requests":return "Too many attempts, try again later";
    case "auth/operation-not-allowed":return "Email/Password login is not enabled in Firebase";
    case "auth/unauthorized-domain":return "This domain is not allowed in Firebase";
    default:return e.message&&!e.code?e.message:"Something went wrong";
  }
}

async function submit(){
  const name=$("#u").value.trim(),pass=$("#p").value,err=$("#err"),go=$("#go");
  err.textContent="";
  if(mode==="register"){
    if(!NAME.test(name)){err.textContent="Username: 3-20 letters, numbers or _";return}
    if(pass.length<5||pass.length>30){err.textContent="Password: 5-30 characters";return}
  }else if(!name||!pass){err.textContent="Enter username and password";return}
  go.disabled=true;
  try{
    if(mode==="register"){
      pending=true;fresh=true;
      try{
        const c=await createUserWithEmailAndPassword(auth,toEmail(name),toPass(pass));
        await updateProfile(c.user,{displayName:name});
      }finally{pending=false}
      loadData(auth.currentUser);
    }else{
      fresh=true;
      await signInWithEmailAndPassword(auth,/^[A-Za-z0-9_]{1,20}$/.test(name)?toEmail(name):"x@beanz.game",toPass(pass));
    }
    click();
  }catch(e){fresh=false;err.textContent=msg(e)}
  go.disabled=false;
}
$("#go").addEventListener("click",submit);
["#u","#p"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")submit()}));

/* Profile */
function renderProfile(d){
  const dn=d.displayName||d.username||"";
  $("#who").textContent=dn;
  $("#whoUser").textContent=d.username?"@"+d.username:"";
  const ts=d.displayNameChangedAt;
  const t=ts&&ts.toMillis?ts.toMillis():0;
  const left=t+7*DAY-Date.now();
  const locked=left>0;
  const inp=$("#dn");
  if(document.activeElement!==inp)inp.value=dn;
  inp.disabled=locked;$("#dnSave").disabled=locked;
  if(locked)say($("#dnNote"),"You can change it again in "+Math.ceil(left/DAY)+(Math.ceil(left/DAY)===1?" day":" days"));
  else if(!$("#dnNote").classList.contains("keep"))say($("#dnNote"),"You can change it once every 7 days");
}

$("#dnSave").addEventListener("click",async()=>{
  const note=$("#dnNote"),v=$("#dn").value.trim();
  if(!userRef)return;
  if(!NAME.test(v)){say(note,"Display name: 3-20 letters, numbers or _",true);return}
  if(v===$("#who").textContent){say(note,"This is already your display name",true);return}
  $("#dnSave").disabled=true;
  try{
    await updateDoc(userRef,{displayName:v,displayNameChangedAt:serverTimestamp()});
    updateDoc(doc(db,"profiles",auth.currentUser.uid),{displayName:v}).catch(()=>{});
    click();say(note,"Saved");
  }catch(e){
    say(note,e.code==="permission-denied"?"You can change it once every 7 days":"Something went wrong",true);
    $("#dnSave").disabled=false;
  }
});

/* Password */
$("#pwBtn").addEventListener("click",async()=>{
  const note=$("#pwNote"),o=$("#pwOld").value,n1=$("#pwNew").value,n2=$("#pwNew2").value,u=auth.currentUser;
  if(!u)return;
  if(!o||!n1||!n2){say(note,"Fill in all fields",true);return}
  if(n1.length<5||n1.length>30){say(note,"New password: 5-30 characters",true);return}
  if(n1!==n2){say(note,"New passwords do not match",true);return}
  if(n1===o){say(note,"New password must be different",true);return}
  $("#pwBtn").disabled=true;
  try{
    await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,toPass(o)));
    await updatePassword(u,toPass(n1));
    ["#pwOld","#pwNew","#pwNew2"].forEach(i=>$(i).value="");
    await revokeOthers();
    click();say(note,"Password changed");
  }catch(e){
    say(note,["auth/invalid-credential","auth/wrong-password"].includes(e.code)?"Wrong current password":msg(e),true);
  }
  $("#pwBtn").disabled=false;
});

/* Log out other devices */
async function revokeOthers(){
  if(!userRef)throw new Error("Not ready");
  const ep=Date.now();
  const prev=getEp();
  setEp(ep);
  try{await updateDoc(userRef,{sessionEpoch:ep})}
  catch(e){if(prev!==null)setEp(prev);throw e}
}
$("#logoutAll").addEventListener("click",async()=>{
  const note=$("#loNote");
  $("#logoutAll").disabled=true;
  try{await revokeOthers();click();say(note,"Logged out on all other devices")}
  catch(e){say(note,"Something went wrong",true)}
  $("#logoutAll").disabled=false;
});

/* Friends */
const OKC=c=>/^#[0-9A-Fa-f]{6}$/.test(c);
let me=null,inc=[],out=[],fr=[],fol=[],fers=0,cache={},subs=[],ftab="friends",rec=[],sq="",sres=[],sTimer,rt=0,nTimer;
const pid=(a,b)=>a<b?a+"_"+b:b+"_"+a;
function fnote(t){const n=$("#fnote");n.textContent=t||"";clearTimeout(nTimer);if(t)nTimer=setTimeout(()=>n.textContent="",3500)}
async function prof(uid){
  const c=cache[uid];
  if(c&&Date.now()-c.t<6e4)return c.d;
  try{const s=await getDoc(doc(db,"profiles",uid));const d=s.exists()?s.data():null;cache[uid]={d,t:Date.now()};return d}
  catch(e){return null}
}
async function syncProfile(){
  const u=auth.currentUser,x=window.BEANZ.get(),pr=doc(db,"profiles",u.uid);
  try{
    const s=await getDoc(pr),us=(await getDoc(doc(db,"users",u.uid))).data();
    const base={username:us.username,usernameLower:us.username.toLowerCase(),displayName:us.displayName||us.username,avatar:{color:x.avatar.color,face:x.avatar.face},acceptsRequests:x.settings.req!==false};
    if(!s.exists())base.rand=Math.random();
    await setDoc(pr,base,{merge:true});
  }catch(e){console.error("Profile:",e)}
}
function counts(){$("#stF").textContent="Friends: "+fr.length;$("#stW").textContent="Followers: "+fers;$("#stFo").textContent="Following: "+fol.length}
function startFriends(user){
  stopFriends();me=user.uid;
  const col=n=>collection(db,n),er=e=>console.error(e);
  subs=[
    onSnapshot(query(col("requests"),where("to","==",me)),s=>{inc=s.docs.map(x=>x.data().from);show()},er),
    onSnapshot(query(col("requests"),where("from","==",me)),s=>{out=s.docs.map(x=>x.data().to);show()},er),
    onSnapshot(query(col("friendships"),where("users","array-contains",me)),s=>{fr=s.docs.map(x=>x.data().users.find(u=>u!==me));counts();show()},er),
    onSnapshot(query(col("follows"),where("followed","==",me)),s=>{fers=s.size;counts()},er),
    onSnapshot(query(col("follows"),where("follower","==",me)),s=>{fol=s.docs.map(x=>x.data().followed);counts();show()},er)
  ];
}
function stopFriends(){
  subs.forEach(u=>u());subs=[];me=null;inc=[];out=[];fr=[];fol=[];fers=0;counts();cache={};Object.keys(sc).forEach(k=>delete sc[k]);rec=[];sres=[];sq="";
  $("#fq").value="";$("#ftabs").style.display="";$("#flist").textContent="";$("#rcount").textContent="";
}
async function act(fn){try{await fn();click()}catch(e){fnote(e.lim||(e.code==="permission-denied"?"Not allowed":"Something went wrong"))}}
const MAX=100;
const lim=m=>{const e=new Error(m);e.lim=m;return e};
async function cnt(q){try{return (await getCountFromServer(q)).data().count}catch(e){return 0}}
const friendsOf=uid=>cnt(query(collection(db,"friendships"),where("users","array-contains",uid)));
const add=uid=>act(async()=>{
  if(fr.length>=MAX)throw lim("You have reached the limit of 100 friends");
  if(await friendsOf(uid)>=MAX)throw lim("This player has reached the limit of 100 friends");
  if(await cnt(query(collection(db,"requests"),where("to","==",uid)))>=MAX)throw lim("This player has too many friend requests");
  await setDoc(doc(db,"requests",me+"_"+uid),{from:me,to:uid,createdAt:serverTimestamp()});
});
const cancel=uid=>act(()=>deleteDoc(doc(db,"requests",me+"_"+uid)));
const decline=uid=>act(()=>deleteDoc(doc(db,"requests",uid+"_"+me)));
const follow=uid=>act(()=>{delete sc[uid];return setDoc(doc(db,"follows",me+"_"+uid),{follower:me,followed:uid,createdAt:serverTimestamp()})});
const unfollow=uid=>act(()=>{delete sc[uid];return deleteDoc(doc(db,"follows",me+"_"+uid))});
const unfriend=uid=>act(()=>deleteDoc(doc(db,"friendships",pid(me,uid))));
const accept=uid=>act(async()=>{
  if(fr.length>=MAX)throw lim("You have reached the limit of 100 friends");
  if(await friendsOf(uid)>=MAX)throw lim("This player has reached the limit of 100 friends");
  const b=writeBatch(db),[x,y]=[me,uid].sort();
  b.set(doc(db,"friendships",x+"_"+y),{users:[x,y],createdAt:serverTimestamp()});
  b.delete(doc(db,"requests",uid+"_"+me));
  if(out.includes(uid))b.delete(doc(db,"requests",me+"_"+uid));
  await b.commit();
});
const sc={};
async function stats(uid){
  const c=sc[uid];if(c&&Date.now()-c.t<6e4)return c.d;
  const col=n=>collection(db,n);
  const g=async q=>{try{return (await getCountFromServer(q)).data().count}catch(e){return null}};
  const d=await Promise.all([g(query(col("friendships"),where("users","array-contains",uid))),g(query(col("follows"),where("followed","==",uid))),g(query(col("follows"),where("follower","==",uid)))]);
  sc[uid]={d,t:Date.now()};return d;
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(uid,p){
  const el=mk("div","pc"),av=mk("div","pav"),nm=mk("div","pn"),ac=mk("div","pa");
  const f=p&&p.avatar&&FACES[p.avatar.face]?p.avatar.face:"smile";
  const c=p&&p.avatar&&OKC(p.avatar.color)?p.avatar.color:"#FFD60A";
  av.innerHTML='<svg viewBox="0 0 260 280">'+window.beanSVG(f,c)+'</svg>';
  const st=mk("div","pstats");
  nm.append(mk("b",null,p?(p.displayName||p.username):"Unknown"),mk("small",null,p?"@"+p.username:""),st);
  if(p)stats(uid).then(d=>{["Friends","Followers","Following"].forEach((n,i)=>{if(d[i]!=null)st.append(mk("span",null,n+": "+d[i]))})});
  const btn=(t,fn,alt)=>{const b=mk("button","fb"+(alt?" alt":""),t);b.onclick=()=>fn(uid);ac.append(b)};
  if(fr.includes(uid))btn("Remove",unfriend,1);
  else if(inc.includes(uid)){btn("Accept",accept);btn("Decline",decline,1)}
  else if(out.includes(uid))btn("Cancel",cancel,1);
  else if(p&&p.acceptsRequests!==false)btn("Add friend",add);
  if(p)btn(fol.includes(uid)?"Unfollow":"Follow",fol.includes(uid)?unfollow:follow,fol.includes(uid));
  el.append(av,nm,ac);return el;
}
async function show(){
  const t=++rt,box=$("#flist");
  $("#rcount").textContent=inc.length>99?"99+":inc.length||"";
  let groups;
  if(sq)groups=[{uids:sres}];
  else if(ftab==="friends")groups=[{uids:fr}];
  else if(ftab==="requests")groups=[{h:"Received",uids:inc},{h:"Sent",uids:out}];
  else groups=[{uids:rec}];
  const all=[...new Set(groups.flatMap(g=>g.uids))];
  const ps=await Promise.all(all.map(prof));
  if(t!==rt)return;
  const P={};all.forEach((u,i)=>P[u]=ps[i]);
  const frag=document.createDocumentFragment();
  groups.forEach(g=>{
    if(!g.uids.length)return;
    if(g.h)frag.append(mk("h3","sec",g.h));
    g.uids.forEach(u=>frag.append(card(u,P[u])));
  });
  if(sq&&!sres.length)frag.append(mk("div","empty","No players found"));
  box.replaceChildren(frag);
}
async function loadRec(){
  try{
    const col=collection(db,"profiles"),r=Math.random();
    let docs=(await getDocs(query(col,where("rand",">=",r),orderBy("rand"),limit(20)))).docs;
    if(docs.length<20)docs=docs.concat((await getDocs(query(col,where("rand","<",r),orderBy("rand"),limit(20-docs.length)))).docs);
    docs.forEach(d=>cache[d.id]={d:d.data(),t:Date.now()});
    rec=docs.filter(d=>d.id!==me&&d.data().acceptsRequests!==false&&!fr.includes(d.id)&&!inc.includes(d.id)&&!out.includes(d.id)).map(d=>d.id);
  }catch(e){console.error(e);rec=[]}
  show();
}
$("#ftabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  ftab=b.dataset.t;
  document.querySelectorAll("#ftabs button").forEach(x=>x.classList.toggle("on",x===b));
  click();
  if(ftab==="recommended")loadRec();else show();
});
$("#fq").addEventListener("input",()=>{
  clearTimeout(sTimer);
  sq=$("#fq").value.trim().toLowerCase();
  $("#ftabs").style.display=sq?"none":"";
  if(!sq){sres=[];show();return}
  sTimer=setTimeout(async()=>{
    const q0=sq;
    try{
      const s=await getDocs(query(collection(db,"profiles"),where("usernameLower",">=",q0),where("usernameLower","<=",q0+"\uf8ff"),orderBy("usernameLower"),limit(15)));
      if(q0!==sq)return;
      s.docs.forEach(d=>cache[d.id]={d:d.data(),t:Date.now()});
      sres=s.docs.map(d=>d.id).filter(u=>u!==me);
    }catch(e){console.error(e);sres=[]}
    show();
  },300);
});

/* Load / save account data */
async function loadData(user){
  const ref=doc(db,"users",user.uid);
  userRef=ref;
  const uname=mainName(user);
  try{
    const snap=await getDoc(ref);
    let d;
    if(snap.exists()){
      d=snap.data();
      const fix={};
      if(!d.username)fix.username=uname;
      if(!d.displayName)fix.displayName=d.username||uname;
      if(Object.keys(fix).length){await updateDoc(ref,fix);Object.assign(d,fix)}
    }else{
      d={username:uname,displayName:uname,bux:0,avatar:{color:"#FFD60A",face:"smile"},settings:{music:true,musicVol:50,sfx:true,sfxVol:70,quality:"Medium",fps:false,req:true},sessionEpoch:0};
      await setDoc(ref,d);
    }
    const ep=d.sessionEpoch||0,stored=getEp();
    if(fresh||stored===null)setEp(ep);
    else if(+stored!==ep){fresh=false;signOut(auth);return}
    fresh=false;
    window.BEANZ.set(d);
    renderProfile(d);
    syncProfile();startFriends(user);
    window.BEANZ.save=()=>{
      clearTimeout(saveTimer);
      saveTimer=setTimeout(()=>{
        const x=window.BEANZ.get();
        setDoc(ref,{bux:x.bux,avatar:x.avatar,settings:x.settings},{merge:true}).catch(e=>console.error(e));
        setDoc(doc(db,"profiles",user.uid),{avatar:x.avatar,acceptsRequests:x.settings.req!==false},{merge:true}).catch(e=>console.error(e));
      },400);
    };
    if(unsub)unsub();
    unsub=onSnapshot(ref,s=>{
      const x=s.data({serverTimestamps:"estimate"});
      if(!x)return;
      const st=getEp();
      if(st!==null&&+st!==(x.sessionEpoch||0)){signOut(auth);return}
      renderProfile(x);
    });
  }catch(e){console.error("Firestore:",e)}
}

onAuthStateChanged(auth,user=>{
  const a=$("#auth");
  a.classList.remove("load");
  window.BEANZ.save=null;
  if(unsub){unsub();unsub=null}
  if(user){
    $("#who").textContent=mainName(user);
    $("#whoUser").textContent="@"+mainName(user);
    a.classList.add("hide");
    if(!pending)loadData(user);
  }else{
    userRef=null;stopFriends();
    ["#u","#p","#pwOld","#pwNew","#pwNew2","#dn"].forEach(i=>$(i).value="");
    ["#dnNote","#pwNote","#loNote"].forEach(i=>say($(i),""));
    a.classList.remove("hide");
  }
});
$("#logout").addEventListener("click",()=>{click();signOut(auth)});
</script>
